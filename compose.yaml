services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-misterchip}
      POSTGRES_USER: ${DB_USER:-misterchip}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-misterchip} -d ${DB_NAME:-misterchip}"]
      interval: 5s
      retries: 10
  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
volumes:
  postgres_data:

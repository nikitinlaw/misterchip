name: Django checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: misterchip
          POSTGRES_USER: misterchip
          POSTGRES_PASSWORD: integration-tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U misterchip -d misterchip"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "not-for-production-automated-tests-only-secret"
      DB_NAME: misterchip
      DB_USER: misterchip
      DB_PASSWORD: integration-tests
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py check
      - run: python manage.py test

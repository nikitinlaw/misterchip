{% extends "catalog/base.html" %}
{% block title %}Установить новый пароль — MISTERCHIP{% endblock %}
{% block content %}
<section class="panel auth-panel">
<h1>Установить новый пароль</h1>
{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Сменить пароль</button></form>{% else %}<p>Ссылка недействительна или устарела. <a href="{% url 'password_reset' %}">Запросите новую</a>.</p>{% endif %}
</section>
{% endblock %}
